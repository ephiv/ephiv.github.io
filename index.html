<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Constantia', serif;
            background-color: #FFFFFF;
            color: #000000;
            overflow-x: hidden;
        }

        .container {
            display: grid;
            grid-template-columns: 280px 1fr 60px;
            grid-template-rows: auto 1fr;
            min-height: 100vh;
        }

        .image-section {
            grid-column: 1;
            grid-row: 1;
            background-color: #045D5D;
            padding: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: sticky;
            top: 0;
            height: 300px;
        }

        .profile-section {
            font-family: 'Nunito', sans-serif;
            grid-column: 1;
            grid-row: 2;
            background-color: #f8f8f8;
            padding: 30px;
            position: sticky;
            top: 300px;
            height: calc(100vh - 300px);
            overflow-y: auto;
        }

        .profile-section h2 {
            color: #045D5D;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .profile-item {
            margin-bottom: 20px;
        }

        .profile-item h3 {
            color: #045D5D;
            font-size: 16px;
            margin-bottom: 8px;
        }

        .profile-item p {
            font-size: 14px;
            line-height: 1.6;
            color: #666;
        }

        .main-content {
            grid-column: 2;
            grid-row: 1 / 3;
            padding: 60px 80px;
            background-color: #FFFFFF;
        }

        .main-content h1 {
            color: #045D5D;
            margin-bottom: 30px;
            font-size: 48px;
        }

        .main-content h2 {
            color: #045D5D;
            margin-bottom: 20px;
            font-size: 32px;
        }

        .main-content p {
            font-size: 18px;
            line-height: 1.8;
            color: #333;
        }

        .navigation {
            grid-column: 3;
            grid-row: 1 / 3;
            background-color: #FFFFFF;
            position: sticky;
            top: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 20px 0;
        }

        .nav-item {
            font-family: 'Nunito', sans-serif;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            padding: 20px 15px;
            text-decoration: none;
            color: #000000;
            background-color: #FFFFFF;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.3s ease;
            text-align: center;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-item:hover {
            background-color: #f0f0f0;
        }

        .nav-item.active {
            background-color: #045D5D;
            color: #FFFFFF;
            border-color: #045D5D;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="image-section">
            <img src="avatar.jpg" style="width: 100%; outline: #024A4A solid 8px; border-radius: 8px;" alt="Illustration by Leef6010">
        </div>

        <div class="profile-section">
            <h2>Profile</h2>
            
            <div class="profile-item">
                <h3>Name</h3>
                <p>Henry Nguyễn</p>
            </div>

            <div class="profile-item">
                <h3>About</h3>
                <p>Ambitious student getting into full-stack development & software</p>
            </div>

            <div class="profile-item">
                <h3>Contacts</h3>
                <p>Email: huan053660@gmail.com</p>
                <p>Phone: +84 0363-163-136</p>
            </div>

            <div class="profile-item">
                <h3>Socials</h3>
                <p>
                    <a href="https://youtube.com/@xociz-hJU7">YouTube</a> • 
                    <a href="https://github.com/ephiv">GitHub</a> • 
                    <a href="https://discordapp.com/users/917070773619916850">Discord</a>
                </p>
            </div>
        </div>

        <div class="main-content">
            <h1>Wait</h1>
        </div>

        <nav class="navigation">
            <a href="#" class="nav-item active">HOME</a>
            <a href="projects.html" class="nav-item">PROJECTS</a>
            <a href="#" class="nav-item">RESOURCES</a>
        </nav>
    </div>
</body>
</html>
